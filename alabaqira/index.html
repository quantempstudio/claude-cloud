<title>العباقرة</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Game-show host console: one dark stage, brass for what matters, teal for correct, coral for wrong */
:root {
  color-scheme: dark;
  --stage: #10161f;
  --panel: #18212d;
  --line: #2a3747;
  --ink: #e9edf2;
  --dim: #8b98a8;
  --brass: #e2b04a;
  --good: #3fbf9f;
  --bad: #e2645a;
  --display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body {
  direction: rtl; background: var(--stage); color: var(--ink); font: 16px/1.6 var(--body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 860px; margin: 0 auto; display: grid; gap: 20px }
h1 { font: 700 clamp(2.4rem, 8vw, 3.6rem)/1.1 var(--display); color: var(--brass); margin: 0; text-align: center }
h1 small { display: block; font: 400 1rem var(--body); color: var(--dim); margin-top: 6px }
h2 { font: 500 1.15rem var(--display); margin: 0 0 12px; color: var(--brass) }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip input { position: absolute; opacity: 0 }
.chip span {
  display: inline-block; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
  cursor: pointer; color: var(--dim); user-select: none;
}
.chip input:checked + span { background: var(--brass); color: var(--stage); border-color: var(--brass); font-weight: 700 }
.chip input:focus-visible + span, button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center }
label.field { display: grid; gap: 4px; color: var(--dim); font-size: .9rem }
input[type=number], input[type=text] {
  background: var(--stage); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font: inherit; width: 100%;
}
input[type=number] { width: 90px }
#names { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin-top: 12px }
button {
  font: 500 1rem var(--body); cursor: pointer; border-radius: 10px; padding: 10px 18px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
button:disabled { opacity: .35; cursor: not-allowed }
button.go { background: var(--brass); color: var(--stage); border-color: var(--brass); font-weight: 700; font-size: 1.15rem; padding: 14px }
.err { color: var(--bad); min-height: 1.5em; margin: 0 }

/* scoreboard */
#board { display: flex; flex-wrap: wrap; gap: 8px }
.team { flex: 1 1 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0 }
.team.on { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset }
.team b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.team .pts { font: 700 1.5rem var(--display); color: var(--brass); font-variant-numeric: tabular-nums }
.team .fxleft { color: var(--dim); font-size: .8rem }

/* question */
.meta { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; color: var(--dim) }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .85rem }
#timer { font: 700 2rem var(--display); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 3ch; text-align: center }
#timer.low { color: var(--bad) }
#qtext { font: 700 clamp(1.3rem, 4.5vw, 1.8rem)/1.5 var(--display); margin: 14px 0; text-wrap: balance }
#opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
#opts button { text-align: start; padding: 14px; font-size: 1.1rem; display: flex; gap: 10px; align-items: baseline }
#opts button i { font: 700 1rem var(--display); color: var(--brass); font-style: normal }
#opts button.peek { border-color: var(--good); border-style: dashed }
#opts button.right { background: var(--good); color: var(--stage); border-color: var(--good) }
#opts button.wrong { background: var(--bad); color: var(--stage); border-color: var(--bad) }
#opts button.right i, #opts button.wrong i { color: inherit }
#opts button.gone { visibility: hidden }
#hint { background: var(--stage); border: 1px dashed var(--brass); border-radius: 10px; padding: 10px 14px; margin: 12px 0 0 }
#fx { display: flex; flex-wrap: wrap; gap: 8px }
#fx button { flex: 1 1 130px; font-size: .95rem }
#fx button.armed { background: var(--brass); color: var(--stage) }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between }
#verdict { font: 700 1.2rem var(--display); margin: 0 }
#verdict.good { color: var(--good) } #verdict.bad { color: var(--bad) }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block }

/* end */
#rank { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none }
#rank li { display: flex; justify-content: space-between; padding: 12px 16px; border-radius: 10px; background: var(--stage); font-size: 1.2rem }
#rank li:first-child { background: var(--brass); color: var(--stage); font-weight: 700 }
@media (prefers-reduced-motion: no-preference) { #opts button { transition: background .2s } }
</style>

<main>
  <h1>العباقرة<small>شاشة المقدّم: لا يراها إلا أنت</small></h1>

  <!-- SETUP -->
  <div id="setup" style="display:grid;gap:20px">
    <section class="card">
      <h2>الفئات</h2>
      <div class="chips" id="cats"></div>
    </section>
    <section class="card">
      <h2>الصعوبة</h2>
      <div class="chips" id="diffs"></div>
    </section>
    <section class="card">
      <h2>طريقة اللعب</h2>
      <div class="chips">
        <label class="chip"><input type="radio" name="mode" value="teams" checked><span>فرق</span></label>
        <label class="chip"><input type="radio" name="mode" value="solo"><span>فردي</span></label>
      </div>
      <div class="row" style="margin-top:14px">
        <label class="field"><span id="countLbl">عدد الفرق</span><input type="number" id="count" min="1" max="8" value="2"></label>
        <label class="field">عدد الأسئلة لكل <span id="perLbl">فريق</span><input type="number" id="per" min="1" max="30" value="5"></label>
      </div>
      <div id="names"></div>
    </section>
    <p class="err" id="setupErr"></p>
    <button class="go" id="start">ابدأ اللعبة</button>
  </div>

  <!-- PLAY -->
  <div id="play" hidden style="display:grid;gap:16px">
    <div id="board"></div>
    <section class="card">
      <div class="meta">
        <div class="row" style="gap:8px">
          <span class="tag" id="roundTag"></span>
          <span class="tag" id="catTag"></span>
          <span class="tag" id="diffTag"></span>
        </div>
        <div id="timer">0</div>
      </div>
      <p style="margin:12px 0 0;color:var(--dim)">الدور على: <b id="turnName" style="color:var(--brass)"></b></p>
      <div id="qtext"></div>
      <div id="opts"></div>
      <p id="hint" hidden></p>
    </section>
    <section class="card">
      <h2>المؤثرات الخاصة</h2>
      <div id="fx"></div>
    </section>
    <div class="ctl">
      <div class="row">
        <button id="peekBtn">إظهار الإجابة لي</button>
        <button id="noAns">لم يجب / انتهى الوقت</button>
      </div>
      <p id="verdict"></p>
      <button class="go" id="next" disabled>التالي</button>
    </div>
    <button id="quit" style="justify-self:start;color:var(--dim)">إنهاء اللعبة</button>
  </div>

  <!-- END -->
  <section class="card" id="end" hidden>
    <h2 id="endTitle">النتيجة النهائية</h2>
    <ol id="rank"></ol>
    <div class="row" style="margin-top:16px">
      <button class="go" id="again">جولة جديدة بنفس الإعدادات</button>
      <button id="reset">تغيير الإعدادات</button>
    </div>
  </section>
</main>

const BANK = {};
for (const c in RAW) { BANK[c] = {}; for (const d in RAW[c])
  BANK[c][d] = RAW[c][d].trim().split('\n').map((l, i) => { const [q, a, w1, w2, w3, hint] = l.split('|'); return { id: `${c}.${d}.${i}`, q, a, wrong: [w1, w2, w3], hint }; }); }

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { arr = [...arr]; for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

// math questions are generated, so this category never runs out
function mathQ(diff) {
  let expr, ans;
  if (diff === 'easy') {
    const k = rnd(0, 2), a = rnd(5, 50), b = rnd(5, 50), c = rnd(2, 9), d = rnd(2, 9);
    [expr, ans] = k === 0 ? [`${a} + ${b}`, a + b] : k === 1 ? [`${a + b} − ${a}`, b] : [`${c} × ${d}`, c * d];
  } else if (diff === 'common') {
    const k = rnd(0, 2);
    if (k === 0) { const a = rnd(11, 25), b = rnd(3, 9); [expr, ans] = [`${a} × ${b}`, a * b]; }
    else if (k === 1) { const b = rnd(3, 12), q = rnd(4, 15); [expr, ans] = [`${b * q} ÷ ${b}`, q]; }
    else { const a = rnd(50, 300), b = rnd(50, 300), c = rnd(50, 300); [expr, ans] = [`${a} + ${b} + ${c}`, a + b + c]; }
  } else if (diff === 'hard') {
    const k = rnd(0, 2);
    if (k === 0) { const a = rnd(12, 39), b = rnd(12, 39); [expr, ans] = [`${a} × ${b}`, a * b]; }
    else if (k === 1) { const p = pick([10, 15, 20, 25, 30, 40, 75]), n = 20 * rnd(2, 40); [expr, ans] = [`${p}% من ${n}`, p * n / 100]; }
    else { const a = rnd(11, 25); [expr, ans] = [`${a}²`, a * a]; }
  } else {
    const k = rnd(0, 2);
    if (k === 0) { const a = rnd(15, 40); [expr, ans] = [`√${a * a}`, a]; }
    else if (k === 1) { const a = rnd(12, 30), b = rnd(12, 30), c = rnd(3, 9), d = rnd(11, 40); [expr, ans] = [`${a} × ${b} − ${c} × ${d}`, a * b - c * d]; }
    else { const k2 = rnd(8, 13); [expr, ans] = [`2^${k2}`, 2 ** k2]; }
  }
  const step = Math.max(1, Math.round(Math.abs(ans) * 0.05));
  const wrong = new Set();
  for (const d of shuffle([1, -1, 2, -2, 10, -10, step, -step, 2 * step, -2 * step])) {
    if (wrong.size === 3) break;
    if (d && ans + d !== ans) wrong.add(ans + d);
  }
  return { id: 'math', math: true, q: `كم ناتج: <span class="ltr">${expr}</span> ؟`, a: String(ans), wrong: [...wrong].map(String), hint: `آخر رقم في الإجابة: ${String(Math.abs(ans)).slice(-1)}` };
}

// ---------- setup ----------
$('cats').innerHTML = Object.entries(CATS).map(([k, v]) => `<label class="chip"><input type="checkbox" name="cat" value="${k}" checked><span>${v}</span></label>`).join('');
$('diffs').innerHTML = Object.entries({ ...DIFFS, random: 'عشوائي' }).map(([k, v], i) => `<label class="chip"><input type="radio" name="diff" value="${k}" ${k === 'random' ? 'checked' : ''}><span>${v}</span></label>`).join('');

function syncNames() {
  const solo = document.querySelector('[name=mode]:checked').value === 'solo';
  $('countLbl').textContent = solo ? 'عدد اللاعبين' : 'عدد الفرق';
  $('perLbl').textContent = solo ? 'لاعب' : 'فريق';
  const n = Math.min(8, Math.max(1, +$('count').value || 1));
  const old = [...$('names').querySelectorAll('input')].map(i => i.value);
  $('names').innerHTML = Array.from({ length: n }, (_, i) =>
    `<input type="text" id="name${i}" value="${old[i] ?? (solo ? 'لاعب ' : 'فريق ') + (i + 1)}" aria-label="الاسم ${i + 1}">`).join('');
}
document.querySelectorAll('[name=mode]').forEach(r => r.onchange = syncNames);
$('count').oninput = syncNames;
syncNames();

let cfg, G;

$('start').onclick = () => {
  const cats = [...document.querySelectorAll('[name=cat]:checked')].map(c => c.value);
  if (!cats.length) return $('setupErr').textContent = 'اختر فئة واحدة على الأقل.';
  const names = [...$('names').querySelectorAll('input')].map((i, n) => i.value.trim() || `فريق ${n + 1}`);
  cfg = {
    cats, names,
    diff: document.querySelector('[name=diff]:checked').value,
    per: Math.min(30, Math.max(1, +$('per').value || 5)),
  };
  $('setupErr').textContent = '';
  newGame();
};

// ---------- game ----------
function newGame() {
  G = {
    round: 0, turn: 0, used: new Set(), peek: false,
    teams: cfg.names.map(name => ({ name, score: 0, fx: Object.fromEntries(Object.keys(FX).map(k => [k, true])) })),
  };
  $('setup').hidden = true; $('end').hidden = true; $('play').hidden = false;
  nextRound();
}

const left = (cat, diff) => cat === 'math' ? Infinity : BANK[cat][diff].filter(q => !G.used.has(q.id)).length;

// every team in a round gets the same category + difficulty
function nextRound() {
  if (G.round >= cfg.per) return finish();
  const diffs = cfg.diff === 'random' ? Object.keys(DIFFS) : [cfg.diff];
  const specs = cfg.cats.flatMap(cat => diffs.map(diff => ({ cat, diff })));
  const ok = specs.filter(s => left(s.cat, s.diff) >= G.teams.length);
  if (!ok.length) return finish('انتهت الأسئلة المتاحة لهذه الإعدادات');
  G.spec = pick(ok);
  G.round++; G.turn = 0;
  startTurn();
}

function draw() {
  const { cat, diff } = G.spec;
  if (cat === 'math') return mathQ(diff);
  const pool = BANK[cat][diff].filter(q => !G.used.has(q.id));
  if (!pool.length) return null;
  const q = pick(pool); G.used.add(q.id); return q;
}

function startTurn(q = draw()) {
  G.q = q; G.done = false; G.double = false; G.cut = false; G.cutSet = null; G.hintOn = false; G.verdict = null;
  G.opts = shuffle([G.q.a, ...G.q.wrong]);
  G.time = SECS[G.spec.diff];
  clearInterval(G.tick);
  G.tick = setInterval(() => { if (G.time > 0 && !G.done) { G.time--; renderTimer(); } }, 1000);
  render();
}

function answer(choice) {
  if (G.done) return;
  G.done = true;
  const ok = choice === G.q.a, team = G.teams[G.turn];
  const pts = PTS[G.spec.diff] * (G.double ? 2 : 1);
  if (ok) team.score += pts;
  G.verdict = choice == null ? ['bad', 'لم يجب. الإجابة: ' + G.q.a] : ok ? ['good', `صح! +${pts}`] : ['bad', 'خطأ. الإجابة: ' + G.q.a];
  G.chosen = choice;
  render();
}

function useFx(k) {
  const team = G.teams[G.turn];
  if (!team.fx[k] || G.done) return;
  if (k === 'swap') {
    const q = draw();
    if (!q) return G.verdict = ['bad', 'لا يوجد سؤال بديل بنفس الفئة والصعوبة'], render();
    team.fx.swap = false;
    const dbl = G.double;
    startTurn(q);
    G.double = dbl;
    return render();
  }
  team.fx[k] = false;
  if (k === 'cut') G.cut = true;
  if (k === 'hint') G.hintOn = true;
  if (k === 'time') G.time += 30;
  if (k === 'double') G.double = true;
  render();
}

function next() {
  G.verdict = null; G.chosen = undefined;
  if (++G.turn < G.teams.length) startTurn(); else nextRound();
}

function finish(msg) {
  clearInterval(G.tick);
  $('play').hidden = true; $('end').hidden = false;
  const ranked = [...G.teams].sort((a, b) => b.score - a.score);
  const tie = ranked.length > 1 && ranked[0].score === ranked[1].score;
  $('endTitle').textContent = msg || (ranked.length === 1 ? 'النتيجة النهائية' : tie ? 'تعادل على الصدارة!' : `الفائز: ${ranked[0].name} 🏆`);
  $('rank').innerHTML = ranked.map(t => `<li><span>${esc(t.name)}</span><b>${t.score}</b></li>`).join('');
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderTimer() {
  $('timer').textContent = G.time;
  $('timer').classList.toggle('low', G.time <= 5);
}

function render() {
  const team = G.teams[G.turn];
  $('board').innerHTML = G.teams.map((t, i) => `<div class="team ${i === G.turn ? 'on' : ''}"><b>${esc(t.name)}</b><span class="pts">${t.score}</span><div class="fxleft">مؤثرات متبقية: ${Object.values(t.fx).filter(Boolean).length}/5</div></div>`).join('');
  $('roundTag').textContent = `الجولة ${G.round} من ${cfg.per}`;
  $('catTag').textContent = CATS[G.spec.cat];
  $('diffTag').textContent = `${DIFFS[G.spec.diff]} · ${PTS[G.spec.diff] * (G.double ? 2 : 1)} نقاط`;
  $('turnName').textContent = team.name + (G.double ? ' (دبل ×2)' : '');
  $('qtext').innerHTML = G.q.math ? G.q.q : esc(G.q.q);

  // the two wrong options removed by "cut" are fixed per question
  if (G.cut && !G.cutSet) G.cutSet = new Set(shuffle(G.q.wrong).slice(0, 2));
  $('opts').innerHTML = G.opts.map((o, i) => {
    let cls = '';
    if (G.done) cls = o === G.q.a ? 'right' : o === G.chosen ? 'wrong' : '';
    else if (G.peek && o === G.q.a) cls = 'peek';
    if (!G.done && G.cutSet?.has(o)) cls += ' gone';
    return `<button class="${cls}" data-i="${i}" ${G.done ? 'disabled' : ''}><i>${'أبجد'[i]}</i><span>${G.q.math ? `<span class="ltr">${o}</span>` : esc(o)}</span></button>`;
  }).join('');
  $('opts').querySelectorAll('button').forEach(b => b.onclick = () => answer(G.opts[b.dataset.i]));

  $('hint').hidden = !G.hintOn;
  $('hint').textContent = '💡 ' + G.q.hint;

  $('fx').innerHTML = Object.entries(FX).map(([k, v]) =>
    `<button data-k="${k}" class="${(k === 'double' && G.double) ? 'armed' : ''}" ${!team.fx[k] || G.done ? 'disabled' : ''}>${v}</button>`).join('');
  $('fx').querySelectorAll('button').forEach(b => b.onclick = () => useFx(b.dataset.k));

  $('peekBtn').textContent = G.peek ? 'إخفاء الإجابة' : 'إظهار الإجابة لي';
  $('noAns').disabled = G.done;
  $('next').disabled = !G.done;
  $('next').textContent = G.turn < G.teams.length - 1 ? 'الفريق التالي' : G.round < cfg.per ? 'الجولة التالية' : 'النتيجة';
  $('verdict').className = G.verdict?.[0] || '';
  $('verdict').textContent = G.verdict?.[1] || '';
  renderTimer();
}

$('peekBtn').onclick = () => { G.peek = !G.peek; render(); };
$('noAns').onclick = () => answer(null);
$('next').onclick = next;
$('quit').onclick = () => finish();
$('again').onclick = newGame;
$('reset').onclick = () => { $('end').hidden = true; $('setup').hidden = false; };
</script>
